name: Python tests

on:
  push:
    branches:
      - feat/2-calculation-business-logic
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt platform system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project with GUI dependency
        run: python -m pip install -e .
      - name: Run all unit and integration tests, including GUI
        run: python -m unittest discover -s tests -v
      - name: Compile application and tests
        run: python -m compileall -q app tests
