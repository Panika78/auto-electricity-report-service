name: Windows onedir release candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "kontakt.spec"
      - "requirements-windows-build.txt"
      - "pyproject.toml"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows Server 2022 x64 (NOT Windows 10/11 acceptance)
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-build.txt
      - name: Build, test, execute frozen EXE twice, and create sanitized ZIP
        shell: pwsh
        env:
          KONTAKT_PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
        run: ./scripts/build_windows.ps1
      - name: Verify ZIP and commit-bound release manifest
        shell: pwsh
        env:
          KONTAKT_PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          $zip = "dist/kontakt-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "Release ZIP is missing." }
          $entries = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if (-not ($entries.Entries | Where-Object FullName -Match '(^|/)kontakt.exe$')) {
              throw "Release ZIP has no kontakt.exe."
            }
            $unsafe = @($entries.Entries | Where-Object {
              # Preserve only PyInstaller's stdlib archive inside _internal.
              $standardLibrary = $_.FullName -match '(?i)(^|/)_internal/base_library\.zip$'
              ($_.FullName -match '(?i)\.(db|sqlite|sqlite3|pdf|bak|backup|tmp|log)$') -or
                (($_.FullName -match '(?i)\.zip$') -and -not $standardLibrary)
            })
            if ($unsafe.Count -gt 0) {
              throw "Release ZIP contains prohibited user-data extensions."
            }
          } finally {
            $entries.Dispose()
          }
          $checkout = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $verify = @("--manifest", "dist/release-manifest.json", "--zip", $zip,
                      "--build-checkout-commit", $checkout, "--build-tree-sha", $tree)
          if ($env:KONTAKT_PR_HEAD_COMMIT) {
            $verify += @("--pr-head-commit", $env:KONTAKT_PR_HEAD_COMMIT)
          }
          python scripts/check_release_manifest.py @verify
          if ($LASTEXITCODE -ne 0) { throw "Release manifest verification failed." }
          python scripts/validate_windows_bundle.py --dist dist/kontakt --zip $zip
          if ($LASTEXITCODE -ne 0) { throw "Release bundle allowlist verification failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: kontakt-windows-x64-rc
          path: |
            dist/kontakt-windows-x64.zip
            dist/release-manifest.json
            dist/build-requirements.txt
          if-no-files-found: error
          retention-days: 14
