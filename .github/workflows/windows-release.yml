name: Windows onedir release candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "kontakt.spec"
      - "requirements-windows-build.txt"
      - "pyproject.toml"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Windows Server 2022 x64 (NOT Windows 10/11 acceptance)
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-build.txt
      - name: Build, test, execute frozen EXE twice, and create sanitized ZIP
        shell: pwsh
        env:
          KONTAKT_PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
        run: ./scripts/build_windows.ps1
      - name: Verify ZIP and commit-bound release manifest
        shell: pwsh
        env:
          KONTAKT_PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          $zip = "dist/kontakt-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "Release ZIP is missing." }
          $entries = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if (-not ($entries.Entries | Where-Object FullName -Match '(^|/)kontakt.exe$')) {
              throw "Release ZIP has no kontakt.exe."
            }
            $unsafe = @($entries.Entries | Where-Object {
              # Preserve only PyInstaller's stdlib archive inside _internal.
              $standardLibrary = $_.FullName -match '(?i)(^|/)_internal/base_library\.zip$'
              ($_.FullName -match '(?i)\.(db|sqlite|sqlite3|pdf|bak|backup|tmp|log)$') -or
                (($_.FullName -match '(?i)\.zip$') -and -not $standardLibrary)
            })
            if ($unsafe.Count -gt 0) {
              throw "Release ZIP contains prohibited user-data extensions."
            }
          } finally {
            $entries.Dispose()
          }
          $checkout = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $verify = @("--manifest", "dist/release-manifest.json", "--zip", $zip,
                      "--build-checkout-commit", $checkout, "--build-tree-sha", $tree)
          if ($env:KONTAKT_PR_HEAD_COMMIT) {
            $verify += @("--pr-head-commit", $env:KONTAKT_PR_HEAD_COMMIT)
          }
          python scripts/check_release_manifest.py @verify
          if ($LASTEXITCODE -ne 0) { throw "Release manifest verification failed." }
          python scripts/validate_windows_bundle.py --dist dist/kontakt --zip $zip
          if ($LASTEXITCODE -ne 0) { throw "Release bundle allowlist verification failed." }
      - uses: actions/upload-artifact@v4
        id: release_artifact
        with:
          name: kontakt-windows-x64-rc
          path: |
            dist/kontakt-windows-x64.zip
            dist/release-manifest.json
            dist/build-requirements.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish checked artifact reference to same-repo PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          KONTAKT_ARTIFACT_ID: ${{ steps.release_artifact.outputs.artifact-id }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/release-manifest.json', 'utf8'));
            const { owner, repo } = context.repo;
            const head = context.payload.pull_request.head.sha;
            if (manifest.pr_head_commit !== head || manifest.build_checkout_commit !== context.sha) {
              throw new Error('Manifest does not match this PR HEAD and actual workflow checkout.');
            }
            // upload-artifact v4 exposes the exact ID synchronously on success.
            const artifactId = Number(process.env.KONTAKT_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('upload-artifact did not provide a valid artifact ID.');
            }
            const artifact = { id: artifactId };
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (pr.head.sha !== head) {
              core.warning('PR advanced during the workflow; do not publish stale artifact metadata.');
              return;
            }
            const start = '<!-- kontakt-release-candidate-start -->';
            const end = '<!-- kontakt-release-candidate-end -->';
            const current = pr.body || '';
            const first = current.indexOf(start);
            const last = current.indexOf(end);
            if (first < 0 || last <= first) throw new Error('PR release metadata markers are missing.');
            const url = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const block = [
              start,
              '**HEAD PR:** ' + manifest.pr_head_commit + '.',
              '**Checkout CI (merge commit):** ' + manifest.build_checkout_commit + '.',
              '**Git tree:** ' + manifest.build_tree_sha + '.',
              '- **Windows release:** [workflow run #' + context.runId + '](' + url + ') — Windows Server 2022 x64.',
              '- **Артефакт:** kontakt-windows-x64-rc (ID ' + artifact.id + '), опубликован именно в этом workflow.',
              '- **SHA-256 внутреннего kontakt-windows-x64.zip:** ' + manifest.zip_sha256 + '.',
              '- **Проверки:** PyInstaller onedir, EXE fresh/existing, нативный GUI, PDF/ZIP, manifest/allowlist. Это НЕ приёмка Windows 10/11.',
              end
            ].join('\n');
            const updated = current.slice(0, first) + block + current.slice(last + end.length);
            await github.rest.pulls.update({ owner, repo, pull_number: context.issue.number, body: updated });
            const { data: saved } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (!saved.body.includes(url) || !saved.body.includes(String(artifact.id)) ||
                !saved.body.includes(manifest.zip_sha256) || !saved.body.includes(manifest.pr_head_commit)) {
              throw new Error('PR artifact reference post-publication verification failed.');
            }
            core.info('PR reference published: run ' + context.runId + ', artifact ' + artifact.id);

  release:
    name: Publish versioned Windows release after successful main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: kontakt-windows-x64-rc
          path: dist
      - name: Validate immutable release manifest against main
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_manifest.py \
            --manifest dist/release-manifest.json \
            --zip dist/kontakt-windows-x64.zip \
            --build-checkout-commit "$GITHUB_SHA" \
            --build-tree-sha "$(git rev-parse 'HEAD^{tree}')"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          import json
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          from app.version import APP_VERSION
          assert version == APP_VERSION, "Version mismatch between project metadata and GUI"
          manifest = json.loads(Path("dist/release-manifest.json").read_text(encoding="utf-8-sig"))
          assert manifest["pr_head_commit"] is None, "A main release must be built from main, not PR merge"
          assert Path("CHANGELOG.md").read_text(encoding="utf-8").find("v" + version) >= 0
          print("Verified release version:", version)
          PY
      - name: Create version tag, release and verified binary assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release version: $tag" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to overwrite a release." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/kontakt-windows-x64.zip \
            dist/release-manifest.json \
            dist/build-requirements.txt \
            --target "$GITHUB_SHA" \
            --title "Контакт $tag" \
            --notes-file CHANGELOG.md \
            --latest
          gh release view "$tag" --json tagName,url --jq '.tagName + " " + .url'
