<body>
<div id="app"></div><div id="modal-root"></div><div id="busy-root"></div><div id="toast-root" class="toast-area" aria-live="polite"></div>
<script>
'use strict';
const STORE='kontakt-prototype-v5';
const $=(s,scope=document)=>scope.querySelector(s);const $$=(s,scope=document)=>[...scope.querySelectorAll(s)];
const ICONS={bolt:'<path d="M13.5 2 4.5 13.2h6.4L10.5 22l9-11.2h-6.4L13.5 2Z"/>',dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',tenants:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 5V3h10v2M8 10h3m2 0h3M8 15h3m2 0h3M3 21h18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 1-1.7 3-1.5-.5a8 8 0 0 1-2.1 1.2L15 21h-3l-.5-1.3a8 8 0 0 1-2.1-1.2l-1.5.5-1.7-3 1.2-1a8 8 0 0 1 0-2.5l-1.2-1 1.7-3 1.5.5a8 8 0 0 1 2.1-1.2L12 6h3l.5 1.3a8 8 0 0 1 2.1 1.2l1.5-.5 1.7 3-1.2 1a8 8 0 0 1 0 2.5Z" transform="translate(-1.5 -1.5) scale(1.1)"/>',plus:'<path d="M12 5v14M5 12h14"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',chevron:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="M4 20h4L20 8l-4-4L4 16v4ZM14 6l4 4"/>',archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v12h14V9M10 14h4"/>',restore:'<path d="M3 12a9 9 0 1 1 4 7.5M3 17v-5h5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',file:'<path d="M5 2h9l5 5v15H5V2ZM14 2v6h5M8 13h8M8 17h8"/>',alert:'<path d="M12 3 2 21h20L12 3ZM12 9v5m0 4h.01"/>',check:'<path d="m5 12 5 5L20 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',trash:'<path d="M4 7h16M10 4h4m-8 3 1 14h10l1-14M10 10v7m4-7v7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',history:'<path d="M3 12a9 9 0 1 1 4 7.5M3 17v-5h5M12 7v5l4 2"/>'};
function icon(name){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ruMonth(monthKey){const [y,m]=monthKey.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}
function prevMonth(key){let [y,m]=key.split('-').map(Number);m--;if(m<1){m=12;y--}return `${y}-${String(m).padStart(2,'0')}`}
function shiftMonth(key,step){let x=key;for(let i=0;i<Math.abs(step);i++)x=step<0?prevMonth(x):nextMonth(x);return x}
function nextMonth(key){let [y,m]=key.split('-').map(Number);m++;if(m>12){m=1;y++}return `${y}-${String(m).padStart(2,'0')}`}
function monthStart(k){return k+'-01'}function monthEnd(k){let [y,m]=k.split('-').map(Number);return `${k}-${new Date(y,m,0).getDate()}`}
function previousNow(){let d=new Date();let y=d.getFullYear(),m=d.getMonth()+1;return prevMonth(`${y}-${String(m).padStart(2,'0')}`)}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseFixed(v,places){if(v===null||v===undefined)return null;let s=String(v).trim().replace(',','.');let m=s.match(/^([+-]?)(\d+)(?:\.(\d+))?$/);if(!m||((m[3]||'').length>places))return null;let a=BigInt(m[2])*10n**BigInt(places)+BigInt(((m[3]||'').padEnd(places,'0'))||'0');return m[1]==='-'?-a:a}
function fmtFixed(v,places,trim=false){if(v===null)return '—';let n=typeof v==='bigint'?v:BigInt(v);let neg=n<0n;let a=neg?-n:n,base=10n**BigInt(places);let frac=String(a%base).padStart(places,'0');if(trim)frac=frac.replace(/0+$/,'');let integer=(a/base).toLocaleString('ru-RU');return (neg?'-':'')+integer+(frac?','+frac:'')}
function toStorage(v,places){if(v===null)return '';let n=typeof v==='bigint'?v:BigInt(v),neg=n<0n,a=neg?-n:n,div=10n**BigInt(places);return(neg?'-':'')+String(a/div)+(places?'.'+String(a%div).padStart(places,'0'):'')}
function validFixed(s,p,zero=true){let v=parseFixed(s,p);return v!==null&&(zero?v>=0n:v>0n)}
function moneyFromExpense(exp,tariff){if(exp===null||tariff===null)return null;let raw=exp*tariff;return (raw>=0n?(raw+50000n)/100000n:(raw-50000n)/100000n)}
function rub(cents){return cents===null?'—':fmtFixed(cents,2)+' ₽'}
function fmtDate(d){if(!d)return '—';let [y,m,day]=d.split('-');return `${day}.${m}.${y}`}
function shortPeriod(c){if(!c.startDate||!c.endDate)return 'Не указан';return `${fmtDate(c.startDate)} — ${fmtDate(c.endDate)}`}
function mkId(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9)}
function nowStamp(){return Date.now()}
const names=['ООО «Северный свет»','ООО «Тихая гавань»','ИП «Орбита»','ООО «Вектор Плюс»','ООО «Линия города»','ООО «Малый берег»','ООО «Точка опоры»','ООО «Синий квадрат»','ООО «Вертикаль»','ООО «Новый маршрут»','ООО «Ритм»','ООО «Тёплый контур»','ООО «Медный мост»'];
function seed(){let key=previousNow(),pm=prevMonth(key);let ts=Date.now();let tenants=names.map((name,i)=>({id:`t${i+1}`,name,inn:`770${String(1234567+i).padStart(7,'0')}`,kpp:'',address:`г. Москва, Примерная ул., д. ${i+3}`,bank:'',bik:'',account:'',corrAccount:'',contract:`АР-${String(i+1).padStart(2,'0')}/26`,contractDate:`${key}-01`,addendum:'',initialReading:String(10000+i*337),initialDate:`${pm}-01`,archived:i===12}));
let calculations=[];const make=(id,i,month,start,end,opt={})=>({id,tenantId:tenants[i].id,month,startDate:monthStart(month),endDate:monthEnd(month),startReading:start,endReading:end,startSource:opt.startSource||'manual',manualStart:!!opt.manualStart,manualExpense:opt.manualExpense??null,manualAmount:opt.manualAmount??null,documents:opt.documents||{},createdAt:ts-1000000+calculations.length*101,updatedAt:ts-1000000+calculations.length*101});
for(let i=0;i<12;i++){const base=10000+i*337;calculations.push(make('old_'+i,i,pm,String(base),String(base+200+i*7)))}
for(let i=0;i<12;i++){const base=10000+i*337+200+i*7;let ending=i===3?'':String(base+(i===4?0:100+i*13));let obj=make('cur_'+i,i,key,String(base),ending,{startSource:'old_'+i});if(i===1){obj.documents={act:{number:'1',date:today(),stale:false,generatedAt:ts-80000},invoice:{number:'1',date:today(),stale:false,generatedAt:ts-80000}}}if(i===2)obj.documents={act:{number:'2',date:today(),stale:true,generatedAt:ts-90000}};if(i===6){obj.endReading=String(base-15)}if(i===7){obj.startReading='';obj.startSource='manual'}if(i===8){obj.manualExpense='135.000';obj.manualAmount='1494.45'}if(i===9){obj.documents={invoice:{number:'2',date:today(),stale:false,generatedAt:ts-80000}}}calculations.push(obj)}
let multi=make('extra_1',0,key,String(10340),String(10428),{startSource:'manual'});multi.startDate=key+'-15';multi.endDate=monthEnd(key);multi.createdAt=ts-1500;multi.updatedAt=ts-1500;calculations.push(multi);
return {tenants,calculations,tariffs:{[key]:'11.0700',[pm]:'10.8500'},settings:{name:'ООО «Образец — исполнитель»',inn:'7701234567',kpp:'',address:'г. Москва, Примерная ул., д. 1',bank:'Учебный банк',bik:'000000000',account:'00000000000000000000',corrAccount:'00000000000000000000',contact:'',signature:'',stamp:'',reuseManualStart:false},selectedMonth:key,section:'dashboard',tenantSearch:'',tenantFilter:'active',calcSearch:'',calcFilter:'all',calcSort:'name',demoversion:5};}
function load(){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.demoversion===5&&Array.isArray(s.tenants)&&Array.isArray(s.calculations))return s}catch(e){}return seed()}
let state=load();
function getAppearance(){const a=state.settings||{};return{fontSize:['compact','standard','large'].includes(a.fontSize)?a.fontSize:'standard',fontWeight:['light','normal','bold'].includes(a.fontWeight)?a.fontWeight:'normal'}}
function applyAppearance(){const a=getAppearance();document.documentElement.style.setProperty('--font-scale',{compact:'.93',standard:'1',large:'1.16'}[a.fontSize]);document.documentElement.style.setProperty('--weight-shift',{light:'-160',normal:'0',bold:'230'}[a.fontWeight]);}
function updateAppearance(kind,value){const accepted=kind==='fontSize'?['compact','standard','large']:kind==='fontWeight'?['light','normal','bold']:[];if(!accepted.includes(value))return;if(state.settings[kind]===value)return;state.settings[kind]=value;applyAppearance();save();render();toast('Оформление интерфейса сохранено.');}
applyAppearance();let modal=null;let modalReturnFocus=null;let viewScroll=0;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){toast('Не удалось сохранить демонстрационные данные в браузере.','error');return false}}
function tenantBy(id){return state.tenants.find(t=>t.id===id)}
function calcBy(id){return state.calculations.find(c=>c.id===id)}
function monthCalcs(month=state.selectedMonth){return state.calculations.filter(c=>c.month===month)}
function calcExpense(c){let a=parseFixed(c.startReading,3),b=parseFixed(c.endReading,3);if(c.manualExpense!==null&&c.manualExpense!==undefined&&c.manualExpense!=='')return parseFixed(c.manualExpense,3);return a!==null&&b!==null?b-a:null}
function calcMoney(c){if(c.manualAmount!==null&&c.manualAmount!==undefined&&c.manualAmount!=='')return parseFixed(c.manualAmount,2);return moneyFromExpense(calcExpense(c),parseFixed(state.tariffs[c.month],4))}
function validate(c){if(!c.startDate||!c.endDate||c.startDate>c.endDate||!c.startDate.startsWith(c.month)||!c.endDate.startsWith(c.month))return {ok:false,why:'Даты должны находиться в одном выбранном месяце.',type:'Ошибка'};let a=parseFixed(c.startReading,3),b=parseFixed(c.endReading,3);if(a===null&&b===null)return{ok:false,why:'Заполните начальные и конечные показания.',type:'Не заполнен'};if(a===null||b===null)return{ok:false,why:'Не хватает начальных или конечных показаний.',type:'Не готов'};if(a<0n||b<0n)return{ok:false,why:'Показания не могут быть отрицательными.',type:'Ошибка'};if(b<a)return{ok:false,why:'Конечные показания меньше начальных. Исправьте показания.',type:'Ошибка'};let ex=calcExpense(c);if(ex===null||ex<0n)return{ok:false,why:'Расход не может быть отрицательным.',type:'Ошибка'};let tariff=parseFixed(state.tariffs[c.month],4);if(tariff===null||tariff<0n)return{ok:false,why:'Для выбранного месяца не установлен тариф.',type:'Не готов'};let sum=calcMoney(c);if(sum===null||sum<0n)return{ok:false,why:'Некорректная сумма; отрицательное значение запрещено.',type:'Ошибка'};let t=tenantBy(c.tenantId);if(!t||!t.name)return{ok:false,why:'Нет сведений об арендаторе.',type:'Не готов'};if(!state.settings.name)return{ok:false,why:'Укажите исполнителя в настройках.',type:'Не готов'};return{ok:true,why:'Расчёт готов к формированию документов.',type:'Готов к формированию',zero:ex===0n}}
function calcStatus(c){const v=validate(c);if(!v.ok)return v.type;let d=['act','invoice'].map(k=>c.documents?.[k]);if(d.some(x=>x?.stale))return 'Требует обновления';if(d.every(x=>!!x?.generatedAt))return 'Документы сформированы';return 'Готов к формированию'}
function docStatus(c,type){let d=c.documents?.[type];if(!d?.generatedAt)return {text:'Не сформирован',cls:'neutral'};return d.stale?{text:'Обновить',cls:'warn'}:{text:'Сформирован',cls:'ok'}}
function pill(text,cls){return `<span class="pill ${cls}">${esc(text)}</span>`}
function statusPill(s){return pill(s,s==='Документы сформированы'?'ok':s==='Требует обновления'?'warn':s==='Готов к формированию'?'blue':s==='Ошибка'?'bad':'neutral')}
function markStale(c){for(let type of ['act','invoice'])if(c.documents?.[type]?.generatedAt)c.documents[type].stale=true}
function sortedByTime(items){return [...items].sort((a,b)=>(b.updatedAt-a.updatedAt)||b.id.localeCompare(a.id))}
function latestReady(tenantId,month=state.selectedMonth){const cs=sortedByTime(state.calculations.filter(c=>c.tenantId===tenantId&&c.month===month));return cs.find(c=>validate(c).ok)||null}
function previousRead(tenantId,month){let pm=prevMonth(month);let arr=sortedByTime(state.calculations.filter(c=>c.tenantId===tenantId&&c.month===pm));let good=arr.find(x=>validFixed(x.endReading,3));if(good)return {value:good.endReading,source:good.id,note:`Из ${ruMonth(pm)}`};if(state.settings.reuseManualStart){let m=arr.find(x=>x.manualStart&&validFixed(x.startReading,3));if(m)return {value:m.startReading,source:m.id,note:`Ручные начальные показания из ${ruMonth(pm)}`}}let t=tenantBy(tenantId);if(t?.initialReading&&validFixed(t.initialReading,3)){return{value:t.initialReading,source:'initial',note:'Из карточки арендатора'}}return{value:'',source:'manual',note:'Нужно указать вручную'};}
function selectNav(to){if(to==='archive'){state.tenantFilter='archived';state.tenantSearch=''}else if(to==='tenants'){state.tenantFilter='active';state.tenantSearch=''}state.section=to;save();closeModal();render();window.scrollTo({top:0})}
function toast(message,type='info'){const id=mkId('toast');const e=document.createElement('div');e.className='toast'+(type==='error'?' error':type==='warning'?' warning':'');e.id=id;e.setAttribute('role','status');e.innerHTML=`<span style="font-size:calc(16px * var(--font-scale))">${type==='error'?'!':type==='warning'?'△':'✓'}</span><span>${esc(message)}</span>`;$('#toast-root').append(e);setTimeout(()=>e.remove(),6500)}
function beginBusy(msg){$('#busy-root').innerHTML=`<div class="busy-overlay" role="status" aria-live="polite"><div class="busy-panel"><span class="spinner" aria-hidden="true"></span><span>${esc(msg)}</span></div></div>`}function endBusy(){$('#busy-root').innerHTML=''}
function showModal(config){if(!modal)modalReturnFocus=document.activeElement;modal=config;renderModal();}
function closeModal(){modal=null;$('#modal-root').innerHTML='';document.body.style.overflow='';$('#app').inert=false;if(modalReturnFocus?.isConnected)modalReturnFocus.focus({preventScroll:true});modalReturnFocus=null}
function setMonth(key){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(key))return;state.selectedMonth=key;save();render()}
function render(){let root=$('#app');root.innerHTML=`<div class="app"><aside class="sidebar"><div class="identity"><div class="logo" aria-hidden="true">${icon('bolt')}</div><div><strong class="wordmark">конт<span class="wordmark-accent">акт</span></strong><small>электроэнергия</small></div></div><div class="side-label">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav class="nav" aria-label="Основная навигация"><button type="button" data-nav="dashboard" class="${state.section==='dashboard'?'active':''}" aria-label="Расчёты" ${state.section==='dashboard'?'aria-current="page"':''}>${icon('dashboard')}<span>Расчёты</span></button><button type="button" data-nav="tenants" class="${state.section==='tenants'?'active':''}" aria-label="Арендаторы" ${state.section==='tenants'?'aria-current="page"':''}>${icon('tenants')}<span>Арендаторы</span></button><button type="button" data-nav="archive" class="nav-sub ${state.section==='archive'?'active':''}" aria-label="Архив арендаторов" ${state.section==='archive'?'aria-current="page"':''}>${icon('archive')}<span>Архив <small class="archive-counter">${state.tenants.filter(t=>t.archived).length}</small></span></button><button type="button" data-nav="settings" class="${state.section==='settings'?'active':''}" aria-label="Настройки" ${state.section==='settings'?'aria-current="page"':''}>${icon('settings')}<span>Настройки</span></button></nav><div class="side-bottom"><div class="sidebar-note"><strong>Офлайн по замыслу</strong><br>Демонстрация в браузере. Без аккаунта и сервера.</div><div class="side-foot"><span class="dot"></span> Локальная демоверсия · UI 1.0</div></div></aside><div class="main"><header class="topbar"><div class="breadcrumbs"><span class="wordmark wordmark-top">конт<span class="wordmark-accent">акт</span></span> <span style="color:#b3bcba;margin:0 9px">/</span> <strong>${state.section==='dashboard'?'Расчёты':state.section==='tenants'?'Арендаторы':state.section==='archive'?'Арендаторы / Архив':'Настройки'}</strong></div><div class="top-meta"><span class="prototype-label">ИНТЕРАКТИВНЫЙ ПРОТОТИП</span><span class="hide-mobile">Локальные демоданные</span><div class="round-mark" aria-label="Один пользователь">К</div></div></header><main class="content"><div class="demo-banner"><span class="info">ⓘ</span><div><strong>Режим демонстрации.</strong> Все организации и реквизиты вымышлены. Состояние сохраняется в браузере; PDF и ZIP создаются локально в упрощённом макете, не вместо эталонных документов.</div><button class="btn sm ghost reset" data-action="reset-demo">Сбросить демо</button></div><div id="section">${state.section==='dashboard'?renderDashboard():(state.section==='tenants'||state.section==='archive')?renderTenants():renderSettings()}</div></main></div></div>`;bindMain()}
function renderDashboard(){const cs=monthCalcs(),active=state.tenants.filter(t=>!t.archived),allReady=cs.filter(c=>validate(c).ok),sums=cs.filter(c=>validate(c).ok).reduce((a,c)=>a+(calcMoney(c)||0n),0n),stale=cs.reduce((n,c)=>n+['act','invoice'].filter(k=>c.documents?.[k]?.stale).length,0);let rows=cs.filter(c=>!tenantBy(c.tenantId)?.archived);let q=state.calcSearch.toLowerCase().trim();if(q)rows=rows.filter(c=>tenantBy(c.tenantId)?.name.toLowerCase().includes(q)||tenantBy(c.tenantId)?.contract.toLowerCase().includes(q));if(state.calcFilter!=='all')rows=rows.filter(c=>{let v=validate(c);return state.calcFilter==='ready'?v.ok:state.calcFilter==='not-ready'?!v.ok:state.calcFilter==='stale'?['act','invoice'].some(k=>c.documents?.[k]?.stale):state.calcFilter==='generated'?['act','invoice'].some(k=>c.documents?.[k]?.generatedAt):true});rows.sort((a,b)=>state.calcSort==='updated'?b.updatedAt-a.updatedAt:state.calcSort==='amount'?((calcMoney(b)||0n)>(calcMoney(a)||0n)?1:(calcMoney(b)||0n)<(calcMoney(a)||0n)?-1:0):tenantBy(a.tenantId).name.localeCompare(tenantBy(b.tenantId).name,'ru')||(b.updatedAt-a.updatedAt));return `<div class="heading"><div><div class="eyebrow">ЕЖЕМЕСЯЧНЫЙ УЧЁТ</div><h1 class="section-title">Расчёты электроэнергии</h1><p class="section-sub">Показания, начисления и документы за один календарный месяц.</p></div><div class="heading-actions"><div class="monthbar" aria-label="Выбор месяца"><button data-action="prev-month" aria-label="Предыдущий месяц">‹</button><input id="month-picker" type="month" value="${esc(state.selectedMonth)}" aria-label="Месяц расчётов"><button data-action="next-month" aria-label="Следующий месяц">›</button></div><button class="btn" data-action="tariff">${icon('edit')} Тариф месяца</button><button class="btn primary" data-action="bulk-export">${icon('download')} Выгрузить всех</button></div></div><div class="grid-kpis"><div class="kpi"><div class="kpi-label">Активные арендаторы <span class="tag">ВСЕ</span></div><div class="kpi-val tabnums">${active.length}</div><div class="kpi-detail">Из ${state.tenants.length} в справочнике</div></div><div class="kpi"><div class="kpi-label">Готовые расчёты <span class="tag">МЕСЯЦ</span></div><div class="kpi-val tabnums">${allReady.filter(c=>!tenantBy(c.tenantId).archived).length}<span style="font-size:calc(15px * var(--font-scale));font-weight:clamp(350,calc(500 + var(--weight-shift)),900);color:#87938f"> / ${cs.filter(c=>!tenantBy(c.tenantId).archived).length}</span></div><div class="kpi-detail">Для формирования документов</div></div><div class="kpi"><div class="kpi-label">Стоимость по готовым <span class="tag">₽</span></div><div class="kpi-val" style="font-size:calc(25px * var(--font-scale))">${fmtFixed(sums,2)} ₽</div><div class="kpi-detail">Сумма по готовым расчётам месяца</div></div><div class="kpi"><div class="kpi-label">Документы к обновлению <span class="tag">АКТ + СЧЁТ</span></div><div class="kpi-val tabnums">${stale}</div><div class="kpi-detail">После изменения исходных данных</div></div></div><section class="panel" aria-label="Таблица расчётов"><div class="panel-head"><div><h2 class="panel-title">${esc(ruMonth(state.selectedMonth))}</h2><p class="panel-desc">Тариф: <strong>${state.tariffs[state.selectedMonth]?fmtFixed(parseFixed(state.tariffs[state.selectedMonth],4),4,true)+' ₽/кВт·ч':'не задан'}</strong> · Каждая строка — отдельный расчёт. Для одного арендатора возможно несколько строк.</p></div><div class="toolbar"><label class="search">${icon('search')}<input id="calc-search" type="search" placeholder="Поиск по названию или договору" value="${esc(state.calcSearch)}" aria-label="Поиск арендатора"></label><select id="calc-filter" class="select" aria-label="Фильтр по статусу"><option value="all" ${state.calcFilter==='all'?'selected':''}>Все статусы</option><option value="ready" ${state.calcFilter==='ready'?'selected':''}>Готовые</option><option value="not-ready" ${state.calcFilter==='not-ready'?'selected':''}>Не готовые</option><option value="generated" ${state.calcFilter==='generated'?'selected':''}>С документами</option><option value="stale" ${state.calcFilter==='stale'?'selected':''}>Требуют обновления</option></select><select id="calc-sort" class="select" aria-label="Сортировка"><option value="name" ${state.calcSort==='name'?'selected':''}>По названию</option><option value="updated" ${state.calcSort==='updated'?'selected':''}>По изменению</option><option value="amount" ${state.calcSort==='amount'?'selected':''}>По сумме</option></select><button class="btn sm dark" data-action="add-calc">${icon('plus')} Расчёт</button></div></div><div class="tablewrap">${rows.length?`<table class="data"><thead><tr><th>Арендатор / договор</th><th>Период</th><th class="right">Начальные</th><th class="right">Конечные</th><th class="right">Расход, кВт·ч</th><th class="right">Сумма</th><th>Готовность</th><th>Акт</th><th>Счёт</th><th class="right">Действия</th></tr></thead><tbody>${rows.map(c=>{let t=tenantBy(c.tenantId),s=calcStatus(c),v=validate(c);return `<tr><td><div class="name">${esc(t.name)}</div><div class="meta">Договор ${esc(t.contract||'не указан')}${cs.filter(x=>x.tenantId===t.id).length>1?' · несколько расчётов':''}</div></td><td class="tabnums">${esc(shortPeriod(c))}</td><td class="right tabnums">${fmtFixed(parseFixed(c.startReading,3),3,true)}</td><td class="right tabnums">${fmtFixed(parseFixed(c.endReading,3),3,true)}</td><td class="right tabnums">${fmtFixed(calcExpense(c),3,true)}${c.manualExpense!==null?'<div class="meta">вручную</div>':''}</td><td class="right money tabnums">${rub(calcMoney(c))}${c.manualAmount!==null?'<div class="meta">вручную</div>':''}</td><td><div class="status-cell">${statusPill(s)}${!v.ok?`<span class="meta" style="max-width:130px">${esc(v.why)}</span>`:''}</div></td><td>${pill(docStatus(c,'act').text,docStatus(c,'act').cls)}</td><td>${pill(docStatus(c,'invoice').text,docStatus(c,'invoice').cls)}</td><td class="right"><div class="cell-actions"><button class="btn sm" data-action="edit-calc" data-id="${c.id}">${icon('edit')} Открыть</button><button class="btn sm icon-only" aria-label="Документы" title="Документы" data-action="export-one" data-id="${c.id}">${icon('file')}</button></div></td></tr>`}).join('')}</tbody></table>`:`<div class="empty"><div class="empty-icon">${icon('calendar')}</div><h3>Расчётов не найдено</h3><p>${q||state.calcFilter!=='all'?'Попробуйте изменить поиск или фильтр.':'Для этого месяца ещё нет расчётов. Можно создать первый.'}</p><button class="btn primary" data-action="add-calc">${icon('plus')} Создать расчёт</button></div>`}</div><div class="panel-footer"><span>Показано ${rows.length} из ${cs.filter(c=>!tenantBy(c.tenantId)?.archived).length} расчётов активных арендаторов</span><span>Данные сохраняются после изменения поля</span></div></section><div class="helpstrip"><span style="font-size:calc(17px * var(--font-scale))">${icon('info')}</span><div><strong>Как проходит работа</strong> Выберите месяц → задайте тариф → откройте расчёт и внесите показания → сформируйте акт, счёт или оба. Если документ нельзя скачать, причина будет указана рядом с расчётом.</div></div>`}
function renderTenants(){const archiveMode=state.section==='archive',archiveCount=state.tenants.filter(t=>t.archived).length;let rows=state.tenants.filter(t=>archiveMode?t.archived:(state.tenantFilter==='all'||(state.tenantFilter==='archived'?t.archived:!t.archived)));if(state.tenantSearch.trim())rows=rows.filter(t=>(t.name+' '+t.inn+' '+t.contract).toLowerCase().includes(state.tenantSearch.toLowerCase().trim()));rows.sort((a,b)=>a.name.localeCompare(b.name,'ru'));return `<div class="heading"><div><div class="eyebrow">СПРАВОЧНИК</div><h1 class="section-title">${archiveMode?'Архив арендаторов':'Арендаторы'}</h1><p class="section-sub">${archiveMode?'Сохранённые карточки, договоры и история. Арендаторов можно восстановить.':'Организации, договоры, первоначальные показания и история.'}</p></div><div class="heading-actions">${archiveMode?`<button class="btn primary" data-action="open-tenants">${icon('arrow')} К активным арендаторам</button>`:`<button class="btn" data-action="open-archive">${icon('archive')} Архив <span class="count-label">${archiveCount}</span></button><button class="btn primary" data-action="add-tenant">${icon('plus')} Добавить арендатора</button>`}</div></div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">${archiveMode?'Карточки в архиве':'Карточки арендаторов'}</h2><p class="panel-desc">${state.tenants.filter(t=>!t.archived).length} активных · ${state.tenants.filter(t=>t.archived).length} в архиве</p></div><div class="toolbar"><label class="search">${icon('search')}<input id="tenant-search" type="search" value="${esc(state.tenantSearch)}" placeholder="Поиск по имени, ИНН, договору" aria-label="Поиск арендаторов"></label>${archiveMode?'':`<select id="tenant-filter" class="select" aria-label="Фильтр арендаторов"><option value="active" ${state.tenantFilter==='active'?'selected':''}>Активные</option><option value="archived" ${state.tenantFilter==='archived'?'selected':''}>Архивные</option><option value="all" ${state.tenantFilter==='all'?'selected':''}>Все</option></select>`}</div></div><div style="padding:0 19px 20px">${rows.length?`<div class="tenant-cards">${rows.map(t=>`<article class="tenant-card"><div>${pill(t.archived?'В архиве':'Активен',t.archived?'neutral':'ok')}</div><h3>${esc(t.name)}</h3><div class="row-meta"><span>ИНН</span><strong class="tabnums">${esc(t.inn||'Не указан')}</strong></div><div class="row-meta"><span>Договор</span><strong>${esc(t.contract||'Не указан')}</strong></div><div class="row-meta"><span>Начальные показания</span><strong class="tabnums">${fmtFixed(parseFixed(t.initialReading,3),3,true)} кВт·ч</strong></div><div class="row-actions"><button class="btn sm" data-action="edit-tenant" data-id="${t.id}">${icon('edit')} Карточка</button><button class="btn sm" data-action="history" data-id="${t.id}">${icon('history')} История</button><button class="btn sm" title="${t.archived?'Восстановить':'В архив'}" aria-label="${t.archived?'Восстановить':'В архив'}" data-action="toggle-archive" data-id="${t.id}">${icon(t.archived?'restore':'archive')} ${t.archived?'Восстановить':'В архив'}</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">${icon('tenants')}</div><h3>${archiveMode?'В архиве нет арендаторов':'Ничего не найдено'}</h3><p>${archiveMode?'Вы сможете вернуться к архивным карточкам после архивирования арендатора.':'Измените условия поиска или создайте карточку арендатора.'}</p><button class="btn primary" data-action="${archiveMode?'open-tenants':'add-tenant'}">${archiveMode?'Открыть активных':'Добавить арендатора'}</button></div>`}</div></section>`}
function renderSettings(){const s=state.settings,appearance=getAppearance();return `<div class="heading"><div><div class="eyebrow">ПАРАМЕТРЫ ДОКУМЕНТОВ</div><h1 class="section-title">Настройки</h1><p class="section-sub">Единый исполнитель, банковские реквизиты, подпись и печать.</p></div><div class="heading-actions"><span class="pill ok">Автосохранение включено</span></div></div><div class="two-col"><section class="panel settings-form" aria-label="Настройки исполнителя"><div class="form-section"><h3>Исполнитель</h3><p class="lead">Данные автоматически используются в новых и повторно сформированных документах.</p><div class="form-grid">${field('name','Наименование / ФИО',s.name,'settings',true)}${field('inn','ИНН',s.inn,'settings')}${field('kpp','КПП (необязательно)',s.kpp,'settings')}${field('address','Юридический / почтовый адрес',s.address,'settings',true)}${field('contact','Контактные данные (необязательно)',s.contact,'settings',true)}</div></div><div class="form-section"><h3>Банковские реквизиты</h3><div class="form-grid">${field('bank','Наименование банка',s.bank,'settings',true)}${field('bik','БИК',s.bik,'settings')}${field('account','Расчётный счёт',s.account,'settings')}${field('corrAccount','Корреспондентский счёт',s.corrAccount,'settings',true)}</div></div><div class="form-section"><h3>Подпись и печать</h3><p class="lead">Изображения необязательны. Подпись заказчика приложение не вставляет.</p><div class="form-grid">${['signature','stamp'].map(k=>`<div class="field"><label>${k==='signature'?'Подпись исполнителя':'Печать исполнителя'}</label><div class="upload-row">${s[k]?`<img class="upload-preview" alt="${k==='signature'?'Предпросмотр подписи':'Предпросмотр печати'}" src="${s[k]}">`:`<div class="upload-placeholder">Не загружено</div>`}<div><label class="btn sm" for="upload-${k}">Загрузить PNG/JPG</label><input type="file" id="upload-${k}" data-upload="${k}" accept="image/png,image/jpeg,image/webp" class="hide">${s[k]?`<div><button class="small-link" data-action="remove-image" data-id="${k}">Удалить изображение</button></div>`:''}</div></div></div>`).join('')}</div></div><div class="form-section"><h3>Начальные показания</h3><div class="switch-line"><input id="reuseManualStart" type="checkbox" ${s.reuseManualStart?'checked':''} data-setting-check="reuseManualStart"><div><label for="reuseManualStart">Переиспользовать вручную заданные начальные показания</label><small>Для ситуаций, когда нет достоверной истории за предыдущий месяц. По умолчанию выключено.</small></div></div></div></section><aside class="panel info-panel"><div class="appearance-settings" aria-label="Настройки шрифта"><h3>Текст интерфейса</h3><p class="appearance-lead">Настройте удобный размер и насыщенность шрифта. Изменения сразу применяются ко всем экранам.</p><div class="appearance-control"><span class="appearance-label" id="font-size-label">Размер шрифта</span><div class="segment-row" role="group" aria-labelledby="font-size-label">${[['compact','Меньше'],['standard','Обычный'],['large','Крупнее']].map(([v,label])=>`<button type="button" class="segment-choice ${appearance.fontSize===v?'is-selected':''}" aria-pressed="${appearance.fontSize===v}" data-appearance="fontSize" data-value="${v}">${label}</button>`).join('')}</div></div><div class="appearance-control"><span class="appearance-label" id="font-weight-label">Насыщенность шрифта</span><div class="segment-row" role="group" aria-labelledby="font-weight-label">${[['light','Лёгкий'],['normal','Обычный'],['bold','Жирный']].map(([v,label])=>`<button type="button" class="segment-choice ${appearance.fontWeight===v?'is-selected':''}" aria-pressed="${appearance.fontWeight===v}" data-appearance="fontWeight" data-value="${v}">${label}</button>`).join('')}</div></div><div class="appearance-preview"><span>ПРЕДПРОСМОТР</span><strong>Расчёты электроэнергии</strong><p>Показания, тарифы и документы</p></div><p class="appearance-hint">Это только оформление прототипа, содержимое актов и счетов не изменяется.</p></div><div class="appearance-divider"></div><h3>О документах</h3><p class="subdued" style="font-size:calc(12px * var(--font-scale))">Реквизиты исполнителя едины для всех арендаторов. При изменении уже сформированные документы требуют повторной выгрузки.</p><div class="list-stat"><em>Исполнитель</em><strong>Один</strong></div><div class="list-stat"><em>Подпись</em><strong>${s.signature?'Загружена':'Не обязательна'}</strong></div><div class="list-stat"><em>Печать</em><strong>${s.stamp?'Загружена':'Не обязательна'}</strong></div><div class="list-stat"><em>Хранение PDF</em><strong>Не ведётся</strong></div><div class="callout" style="margin-top:21px"><b>Важно для прототипа</b><br>Поля сохраняются в хранилище этого браузера. Реальное приложение будет использовать локальную SQLite-базу; HTML-прототип её не создаёт.</div></aside></div>`}
function field(k,label,v,context,wide=false,kind='text'){return `<div class="field${wide?' wide':''}"><label for="${context}-${k}">${esc(label)}</label><input id="${context}-${k}" name="${k}" data-context="${context}" type="${kind}" autocomplete="off" value="${esc(v??'')}"></div>`}
function bindMain(){$$('[data-nav]').forEach(b=>b.onclick=()=>selectNav(b.dataset.nav));$$('[data-action]').forEach(b=>b.onclick=()=>perform(b.dataset.action,b.dataset.id));let m=$('#month-picker');if(m)m.onchange=()=>setMonth(m.value);let c=$('#calc-search');if(c)c.oninput=()=>{state.calcSearch=c.value;save();replaceSectionKeepInput('calc-search')};let cf=$('#calc-filter');if(cf)cf.onchange=()=>{state.calcFilter=cf.value;save();replaceSectionKeepInput()};let cs=$('#calc-sort');if(cs)cs.onchange=()=>{state.calcSort=cs.value;save();replaceSectionKeepInput()};let ts=$('#tenant-search');if(ts)ts.oninput=()=>{state.tenantSearch=ts.value;save();replaceSectionKeepInput('tenant-search')};let tf=$('#tenant-filter');if(tf)tf.onchange=()=>{state.tenantFilter=tf.value;save();replaceSectionKeepInput()};$$('[data-context="settings"]').forEach(el=>{el.onchange=()=>updateSetting(el.name,el.value);el.onblur=()=>{if(state.settings[el.name]!==el.value)updateSetting(el.name,el.value)}});$$('[data-setting-check]').forEach(e=>e.onchange=()=>updateSetting(e.dataset.settingCheck,e.checked));$$('[data-appearance]').forEach(e=>e.onclick=()=>updateAppearance(e.dataset.appearance,e.dataset.value));$$('[data-upload]').forEach(e=>e.onchange=()=>uploadImage(e.dataset.upload,e.files[0]));}
function replaceSectionKeepInput(focusId){let old=focusId?$('#'+focusId):null;let pos=old?.selectionStart??0;let section=$('#section');section.innerHTML=state.section==='dashboard'?renderDashboard():(state.section==='tenants'||state.section==='archive')?renderTenants():renderSettings();bindMain();if(focusId){let e=$('#'+focusId);e?.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
function updateSetting(k,v){if(state.settings[k]===v)return;if(k==='name'&&!String(v).trim()){toast('Наименование исполнителя не может быть пустым.','error');render();return}state.settings[k]=v;state.calculations.forEach(markStale);save();toast('Настройки сохранены. Ранее сформированные документы отмечены для обновления.');render()}
function uploadImage(kind,file){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>2*1024*1024){toast('Используйте PNG/JPG/WebP размером до 2 МБ.','error');return}const reader=new FileReader();reader.onload=()=>{state.settings[kind]=reader.result;state.calculations.forEach(markStale);save();render();toast('Изображение добавлено в демоданные.')};reader.onerror=()=>toast('Не удалось прочитать изображение.','error');reader.readAsDataURL(file)}
function perform(action,id){switch(action){case'reset-demo':return confirmBox('Сбросить демонстрацию','Все изменения, внесённые в этом браузере, будут заменены стартовыми вымышленными данными. Это действие относится только к прототипу.',()=>{state=seed();applyAppearance();save();render();toast('Демоданные восстановлены.')},true);case'prev-month':return setMonth(prevMonth(state.selectedMonth));case'next-month':return setMonth(nextMonth(state.selectedMonth));case'tariff':return openTariff();case'add-calc':return openCalculation(null);case'edit-calc':return openCalculation(id);case'export-one':return openExport(id);case'bulk-export':return openExport(null);case'open-archive':return selectNav('archive');case'open-tenants':return selectNav('tenants');case'add-tenant':return openTenant();case'edit-tenant':return openTenant(id);case'history':return openHistory(id);case'toggle-archive':return archiveTenant(id);case'remove-image':return confirmBox('Удалить изображение?',`Изображение ${id==='signature'?'подписи':'печати'} будет удалено. Ранее сформированные документы потребуют обновления.`,()=>{state.settings[id]='';state.calculations.forEach(markStale);save();render();toast('Изображение удалено.')},true);}}
function confirmBox(title,body,onYes,danger=false,onNo=null,yesText='Подтвердить'){const previous=modal;showModal({type:'confirm',title,body,onYes,onNo,previous,danger,yesText})}
function openTariff(){showModal({type:'tariff',month:state.selectedMonth,value:state.tariffs[state.selectedMonth]??''})}
function openTenant(id=null){let t=id?tenantBy(id):null;showModal({type:'tenant',id,tab:'details',draft:t?structuredClone(t):{id:null,name:'',inn:'',kpp:'',address:'',bank:'',bik:'',account:'',corrAccount:'',contract:'',contractDate:'',addendum:'',initialReading:'',initialDate:monthStart(state.selectedMonth),archived:false}})}
function openHistory(id){showModal({type:'history',tenantId:id})}
function newCalcFor(tenantId,month=state.selectedMonth){let p=previousRead(tenantId,month);return{id:null,tenantId,month,startDate:monthStart(month),endDate:monthEnd(month),startReading:p.value,endReading:'',startSource:p.source,manualStart:p.source==='manual',manualExpense:null,manualAmount:null,documents:{},createdAt:nowStamp(),updatedAt:nowStamp()}}
function openCalculation(id=null,tenantId=null){let active=state.tenants.filter(t=>!t.archived);if(!id&&!active.length){toast('Сначала добавьте активного арендатора.','warning');selectNav('tenants');return}let c=id?calcBy(id):newCalcFor(tenantId||active[0].id);if(!c){toast('Расчёт не найден.','error');return}showModal({type:'calculation',id,month:c.month,draft:structuredClone(c)})}
function docNumber(type,docDate,skipCalcId=null){const y=docDate.slice(0,4);let nums=state.calculations.flatMap(c=>{let d=c.documents?.[type];return d&&c.id!==skipCalcId&&d.date?.startsWith(y)&&/^\d+$/.test(String(d.number))?[Number(d.number)]:[]});return String((nums.length?Math.max(...nums):0)+1)}
function openExport(id){let selected=id?calcBy(id):null;if(id&&!selected){toast('Расчёт не найден.','error');return}if(selected&&!validate(selected).ok){const v=validate(selected);showModal({type:'blocked',calcId:id,why:v.why});return}let date=today();showModal({type:'export',id,act:true,invoice:true,meta:id?Object.fromEntries(['act','invoice'].map(k=>{let d=selected.documents?.[k];return[k,{number:d?.number||docNumber(k,date,selected.id),date:d?.date||date,auto:!d}]})):null})}
function archiveTenant(id){const t=tenantBy(id);if(!t)return;confirmBox(t.archived?'Восстановить арендатора?':'Переместить арендатора в архив?',t.archived?`${t.name} снова появится в активном списке и будет участвовать в массовой выгрузке.`:`${t.name} исчезнет из активного списка и массовой выгрузки. Все расчёты и документы останутся в истории.`,()=>{t.archived=!t.archived;save();render();toast(t.archived?'Арендатор перенесён в архив.':'Арендатор восстановлен.')},!t.archived)}
function renderModal(){const root=$('#modal-root');if(!modal){root.innerHTML='';document.body.style.overflow='';return}document.body.style.overflow='hidden';$('#app').inert=true;let content='';switch(modal.type){case'confirm':content=modalConfirm();break;case'tariff':content=modalTariff();break;case'tenant':content=modalTenant();break;case'history':content=modalHistory();break;case'calculation':content=modalCalculation();break;case'export':content=modalExport();break;case'blocked':content=modalBlocked();break;case'result':content=modalResult();break;default:return}root.innerHTML=`<div class="overlay" id="modal-overlay"><div class="modal ${['calculation','tenant','history','export','result'].includes(modal.type)?'wide':(['confirm','tariff','blocked'].includes(modal.type)?'small':'')}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${content}</div></div>`;const overlay=$('#modal-overlay');overlay.onclick=e=>{if(e.target===overlay)closeModal()};root.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>handleModalAction(b.dataset.modal,b.dataset.id));let f=$('form',root);if(f)f.onsubmit=e=>{e.preventDefault();handleModalAction(f.dataset.submit)};bindModalFields();let target=$('input:not([type=hidden]):not([disabled]),select,textarea,button',root);target?.focus({preventScroll:true})}
function mh(title,subtitle=''){return `<div class="modal-head"><div><h2 id="dialog-title">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button class="icon-btn" type="button" data-modal="close" aria-label="Закрыть окно">${icon('close')}</button></div>`}
function mf(body,left=''){return `<div class="modal-footer">${left?`<span class="left-note">${left}</span>`:''}${body}</div>`}
function modalConfirm(){return mh(modal.title)+`<div class="modal-body"><div class="callout ${modal.danger?'warn':''}">${esc(modal.body)}</div></div>`+mf(`<button class="btn" data-modal="cancel-confirm">Отмена</button><button class="btn ${modal.danger?'danger':'primary'}" data-modal="yes-confirm">${esc(modal.yesText)}</button>`)}
function modalTariff(){let used=monthCalcs(modal.month).length;return mh('Тариф месяца',ruMonth(modal.month))+`<form data-submit="save-tariff"><div class="modal-body"><div class="field"><label for="tariff-value">Единый тариф, ₽/кВт·ч</label><input id="tariff-value" name="value" inputmode="decimal" placeholder="Например, 11,0700" value="${esc(modal.value)}" autocomplete="off" required><div class="hint">До 4 знаков после запятой. Не переносится автоматически в другие месяцы.</div></div><div class="callout ${used?'warn':''}" style="margin-top:17px">${used?`В этом месяце есть ${used} расчётов. Изменение тарифа пересчитает суммы, сбросит ручные суммы и пометит ранее сформированные документы для обновления. Потребуется подтверждение.`:'Если тариф не задан, показания можно сохранить, но формирование документов недоступно.'}</div><p id="tariff-error" class="text-error" aria-live="polite"></p></div>${mf('<button class="btn" type="button" data-modal="close">Отмена</button><button class="btn primary" type="submit">Применить тариф</button>','Действует сразу после подтверждения.')}</form>`}
const tenantFields=[['name','Наименование организации / ФИО','text',1],['inn','ИНН','text',0],['kpp','КПП (необязательно)','text',0],['address','Адрес','text',1],['bank','Банк арендатора','text',1],['bik','БИК арендатора','text',0],['account','Расчётный счёт','text',0],['corrAccount','Корреспондентский счёт','text',1],['contract','Договор №','text',0],['contractDate','Дата договора','date',0],['addendum','Дополнительное соглашение / основание','text',1],['initialReading','Первоначальные показания, кВт·ч','text',0],['initialDate','Дата первоначальных показаний','date',0]];
function modalTenant(){let t=modal.draft;return mh(modal.id?'Карточка арендатора':'Новый арендатор',modal.id?'Редактирование реквизитов и исходных данных.':'Первый расчёт можно создать после добавления карточки.')+`${modal.id?`<div class="modal-tabs"><button class="${modal.tab==='details'?'active':''}" data-modal="tab-details">Реквизиты и договор</button><button class="${modal.tab==='history'?'active':''}" data-modal="tab-history">История расчётов</button></div>`:''}`+(modal.tab==='history'&&modal.id?`<div class="modal-body">${historyList(modal.id)}</div>${mf('<button class="btn" data-modal="close">Закрыть</button>'+(t.archived?'':'<button class="btn primary" data-modal="add-calc-for-tenant">'+icon('plus')+' Новый расчёт</button>'))}`:`<form data-submit="${modal.id?'save-tenant-auto':'save-tenant'}"><div class="modal-body"><div class="form-grid">${tenantFields.map(([k,label,type,w])=>`<div class="field ${w?'wide':''}"><label for="tn-${k}">${esc(label)}${k==='name'?' *':''}</label><input id="tn-${k}" name="${k}" type="${type}" value="${esc(t[k]||'')}" ${k==='initialReading'?'inputmode="decimal"':''} autocomplete="off" ${k==='name'?'required':''}></div>`).join('')}</div><p id="tenant-error" class="text-error" aria-live="polite"></p><div class="callout" style="margin-top:15px">Изменение реквизитов влияет на повторную генерацию всех ранее созданных документов этого арендатора. При удалении или архивировании организация не теряет историю.</div></div>${mf('<button class="btn" type="button" data-modal="close">Отмена</button><button class="btn primary" '+(modal.id?'type="button" data-modal="close"':'type="submit"')+'>'+(modal.id?'Готово':'Добавить арендатора')+'</button>',modal.id?'Изменения сохраняются автоматически после завершения ввода.':'Запись создаётся после заполнения формы.')}</form>`) }
function historyList(tenantId){let cs=state.calculations.filter(c=>c.tenantId===tenantId).sort((a,b)=>b.month.localeCompare(a.month)||b.updatedAt-a.updatedAt);if(!cs.length)return '<div class="empty"><h3>История пока пуста</h3><p>Создайте первый расчёт для этого арендатора.</p></div>';return `<div class="mini-list">${cs.map(c=>`<div class="mini-item"><div><strong>${esc(ruMonth(c.month))}</strong><small>${esc(shortPeriod(c))} · ${fmtFixed(calcExpense(c),3,true)} кВт·ч · ${rub(calcMoney(c))}</small></div><div class="form-line">${statusPill(calcStatus(c))}<button class="btn sm" data-modal="open-calc" data-id="${c.id}">Открыть</button></div></div>`).join('')}</div>`}
function modalHistory(){let t=tenantBy(modal.tenantId);return mh('История арендатора',t?.name||'Арендатор')+`<div class="modal-body"><div class="callout" style="margin-bottom:15px">Все сохранённые расчёты доступны независимо от месяца, включая архивные. Каждый расчёт имеет собственные документы.</div>${historyList(modal.tenantId)}</div>${mf(`<button class="btn" data-modal="close">Закрыть</button>${t&&!t.archived?`<button class="btn primary" data-modal="add-calc-for-tenant">${icon('plus')} Новый расчёт</button>`:''}`)}`}
function calcInput(k,label,value,type='text',wide=false,attr=''){return `<div class="field${wide?' wide':''}"><label for="calc-${k}">${esc(label)}</label><input id="calc-${k}" name="${k}" type="${type}" value="${esc(value??'')}" ${attr} autocomplete="off"></div>`}
function modalCalculation(){let c=modal.draft,existing=!!modal.id,t=tenantBy(c.tenantId),v=validate(c),p=previousRead(c.tenantId,c.month);let tenants=state.tenants.filter(x=>!x.archived);return mh(existing?'Редактирование расчёта':'Новый расчёт',ruMonth(c.month)+' · '+(existing?t.name:'выберите арендатора'))+`<form data-submit="${existing?'save-calc-auto':'save-calc'}"><div class="modal-body"><div class="form-section" style="padding:0 0 20px"><h3>Арендатор и расчётный период</h3><div class="form-grid"><div class="field wide"><label for="calc-tenantId">Арендатор</label>${existing?`<input id="calc-tenantId" name="tenantId" value="${esc(t?.name||'')}" readonly><input type="hidden" name="realTenantId" value="${esc(c.tenantId)}">`:`<select id="calc-tenantId" name="tenantId">${tenants.map(t=>`<option value="${t.id}" ${t.id===c.tenantId?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`}</div>${calcInput('startDate','Начало периода',c.startDate,'date')}${calcInput('endDate','Конец периода',c.endDate,'date')}</div><p class="subdued" style="font-size:calc(11px * var(--font-scale));margin:10px 0 0">Обе даты должны находиться внутри ${esc(ruMonth(c.month))}. Совпадающие периоды разрешены после предупреждения.</p></div><div class="form-section" style="padding:20px 0"><h3>Показания счётчика</h3><div class="form-grid">${calcInput('startReading','Начальные, кВт·ч',c.startReading,'text',false,'inputmode="decimal" placeholder="0,000"')}${calcInput('endReading','Конечные, кВт·ч',c.endReading,'text',false,'inputmode="decimal" placeholder="0,000"')}</div><p class="subdued" style="font-size:calc(11px * var(--font-scale));margin:9px 0 0">${c.startSource==='manual'?'Ручной ввод начальных показаний':c.startSource==='initial'?'Из первоначальных показаний карточки арендатора':`Автоподстановка: ${esc(p.note)}`}. Начальные показания можно изменить вручную.</p></div><div class="form-section" style="padding:20px 0 0;border-bottom:0"><h3>Ручные корректировки</h3><p class="lead">Автоматические значения рассчитываются из показаний и тарифа. Ручное изменение требует подтверждения.</p><div class="form-grid"><div class="field"><label class="checkbox-row"><input id="calc-manualExpenseCheck" name="manualExpenseCheck" type="checkbox" ${c.manualExpense!==null?'checked':''}> Изменить расход вручную</label><input id="calc-manualExpense" name="manualExpense" inputmode="decimal" value="${esc(c.manualExpense??'')}" ${c.manualExpense===null?'disabled':''} placeholder="Например, 130,000"></div><div class="field"><label class="checkbox-row"><input id="calc-manualAmountCheck" name="manualAmountCheck" type="checkbox" ${c.manualAmount!==null?'checked':''}> Изменить сумму вручную</label><input id="calc-manualAmount" name="manualAmount" inputmode="decimal" value="${esc(c.manualAmount??'')}" ${c.manualAmount===null?'disabled':''} placeholder="Например, 1500,00"></div></div><p class="subdued" style="font-size:calc(11px * var(--font-scale));margin:9px 0 0">Изменение показаний сбрасывает ручные расход и сумму. Изменение расхода или тарифа сбрасывает ручную сумму.</p></div><div class="preview-box" style="margin-top:22px" id="calc-preview">${calcPreview(c)}</div><p id="calc-error" class="text-error" role="alert"></p></div>${mf(`<button class="btn danger" type="button" data-modal="delete-calc" ${existing?'':'hidden'}>${icon('trash')} Удалить</button><button class="btn" type="button" data-modal="close">Отмена</button><button class="btn primary" type="${existing?'button':'submit'}" ${existing?'data-modal="close"':''}>${existing?'Готово':'Создать расчёт'}</button>`,existing?'Изменения автосохраняются после завершения ввода.':'Черновики с недостающими показаниями сохраняются.')}</form>`}
function calcPreview(c){let v=validate(c),expense=calcExpense(c),sum=calcMoney(c);return `<div class="preview-title">Предварительный расчёт</div><div class="preview-grid"><div><span>Расход</span><strong>${fmtFixed(expense,3,true)} <small style="font-size:calc(11px * var(--font-scale))">кВт·ч</small></strong></div><div><span>Тариф месяца</span><strong>${fmtFixed(parseFixed(state.tariffs[c.month],4),4,true)} ₽</strong></div><div><span>К оплате</span><strong>${rub(sum)}</strong></div></div><div style="display:flex;align-items:flex-start;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid #dce3dc">${statusPill(v.type)} <small class="subdued">${esc(v.why)}</small></div>`}
function modalExport(){let c=modal.id?calcBy(modal.id):null;let eligible=null;if(!c){let active=state.tenants.filter(t=>!t.archived),out=active.map(t=>{let calc=latestReady(t.id);let reason=calc?(calcExpense(calc)===0n?'Последний готовый расчёт — нулевой расход':null):'Нет готового расчёта';return{tenant:t,calc,reason}});eligible=out;}let ready=eligible?.filter(x=>!x.reason)||[];return mh(c?'Документы расчёта':'Массовая выгрузка',c?`${tenantBy(c.tenantId)?.name} · ${ruMonth(c.month)}`:`${ruMonth(state.selectedMonth)} · все активные арендаторы`)+`<form data-submit="start-export"><div class="modal-body"><div class="form-section" style="padding:0 0 18px"><h3>Выберите документы</h3><div class="form-line"><label class="checkbox-row" style="margin-right:30px"><input type="checkbox" id="export-act" ${modal.act?'checked':''}> Акт</label><label class="checkbox-row"><input type="checkbox" id="export-invoice" ${modal.invoice?'checked':''}> Счёт на оплату</label></div><p class="subdued" style="font-size:calc(11px * var(--font-scale))">По умолчанию выбраны оба типа. Серии номеров ведутся независимо по году даты документа.</p></div>${c?`<div class="form-section" style="padding:19px 0 0;border:0"><h3>Номера и даты документов</h3><div class="form-grid">${['act','invoice'].map(k=>{let m=modal.meta[k];return `<div class="field" id="doc-row-${k}"><label>${k==='act'?'Акт':'Счёт'}</label><div class="form-line"><div style="flex:1;min-width:80px"><label for="docnum-${k}" class="subdued" style="font-size:calc(10px * var(--font-scale))">Номер</label><input id="docnum-${k}" name="docnum-${k}" inputmode="numeric" value="${esc(m.number)}"></div><div style="flex:1.5;min-width:115px"><label for="docdate-${k}" class="subdued" style="font-size:calc(10px * var(--font-scale))">Дата документа</label><input id="docdate-${k}" name="docdate-${k}" type="date" value="${esc(m.date)}"></div></div><div class="hint">${c.documents?.[k]?.generatedAt?'Сохранённые реквизиты; можно изменить':'Предлагаемый номер по году документа'}</div></div>`}).join('')}</div><div class="callout ${calcExpense(c)===0n?'warn':'good'}" style="margin-top:18px">${calcExpense(c)===0n?'<b>Нулевой расход.</b> Для индивидуальной выгрузки потребуется отдельное подтверждение.':'Данные проверены: документы можно сформировать.'} ${c.documents?.act?.stale||c.documents?.invoice?.stale?'Ранее сформированные документы требуют обновления.':''}</div></div>`:`<div class="form-section" style="padding:18px 0 0;border:0"><h3>Предварительный отбор · ${ready.length} из ${eligible.length}</h3><div class="mini-list" style="max-height:340px;overflow:auto">${eligible.map(x=>`<div class="mini-item"><div><strong>${esc(x.tenant.name)}</strong><small>${x.calc?`${fmtFixed(calcExpense(x.calc),3,true)} кВт·ч · ${rub(calcMoney(x.calc))}`:'Нет готового расчёта'}</small></div>${x.reason?pill('Пропуск: '+x.reason,'warn'):pill('Включён','ok')}</div>`).join('')}</div><p class="subdued" style="font-size:calc(11px * var(--font-scale));margin-top:13px">Если самый новый расчёт не готов, используется последний готовый. Если последний готовый нулевой — арендатор пропускается.</p></div>`}<p id="export-error" class="text-error" role="alert"></p><div class="callout" style="margin-top:18px"><b>Локальная демо-генерация</b><br>В этом HTML создаются настоящие PDF (растровая страница) и ZIP, но оформление PDF условное, не соответствует утверждённым Word/Excel-образцам. В реальном приложении используется ReportLab.</div></div>${mf(`<button class="btn" type="button" data-modal="close">Отмена</button><button class="btn primary" type="submit">${icon('download')} ${c?'Скачать PDF':'Скачать ZIP'}</button>`,'Без сервера. Файлы формируются в браузере.')}</form>`}

function bindModalFields(){let root=$('#modal-root');if(!modal)return;if(modal.type==='calculation'){let f=$('form',root);if(!f)return;let exp=$('#calc-manualExpenseCheck'),amount=$('#calc-manualAmountCheck');exp.onchange=()=>{$('#calc-manualExpense').disabled=!exp.checked;if(exp.checked&&!$('#calc-manualExpense').value){$('#calc-manualExpense').value=toStorage(calcExpense(modal.draft)||0n,3)}updateCalcPreview()};amount.onchange=()=>{$('#calc-manualAmount').disabled=!amount.checked;if(amount.checked&&!$('#calc-manualAmount').value){$('#calc-manualAmount').value=toStorage(calcMoney(modal.draft)||0n,2)}updateCalcPreview()};$$('input,select',f).forEach(el=>el.addEventListener('input',()=>{if(el.id==='calc-tenantId'&&!modal.id){let p=previousRead(el.value,modal.month);$('#calc-startReading').value=p.value;modal.draft.startSource=p.source;}updateCalcPreview()}));if(modal.id)f.addEventListener('change',()=>{if(modal?.type==='calculation')saveCalculation(true)});}if(modal.type==='tenant'&&modal.id&&modal.tab==='details'){let f=$('form',root);if(f)f.addEventListener('change',()=>{if(modal?.type==='tenant')saveTenant(true)});}

function saveTariff(){let s=$('#tariff-value')?.value.trim()||'',v=parseFixed(s,4);if(v===null||v<0n){modalError('tariff-error','Введите неотрицательный тариф с точностью до 4 знаков.');return}if(String(state.tariffs[modal.month]??'')===toStorage(v,4)){closeModal();toast('Тариф не изменился.');return}let month=modal.month,cs=monthCalcs(month),apply=()=>{state.tariffs[month]=toStorage(v,4);cs.forEach(c=>{c.manualAmount=null;c.updatedAt=nowStamp();markStale(c)});save();render();toast('Тариф применён, затронутые суммы пересчитаны.')};if(cs.length)confirmBox('Пересчитать связанные расчёты?',`Для ${cs.length} расчётов за ${ruMonth(month)} будет применён новый тариф. Ручные суммы сбросятся; сформированные документы потребуют обновления.`,apply,false,()=>openTariff(), 'Подтвердить перерасчёт');else{apply()}}
function saveTenant(stayOpen=false){let f=$('#modal-root form');if(!f)return;let form=new FormData(f),d=structuredClone(modal.draft);for(let [k] of tenantFields)d[k]=String(form.get(k)||'').trim();if(!d.name){modalError('tenant-error','Укажите название арендатора.');return}if(d.initialReading&&!validFixed(d.initialReading,3)){modalError('tenant-error','Начальные показания: неотрицательное число, максимум 3 знака после запятой.');return}if(d.initialReading)d.initialReading=toStorage(parseFixed(d.initialReading,3),3);let old=modal.id?tenantBy(modal.id):null;let readingChanged=old&&old.initialReading!==d.initialReading;let dependent=readingChanged?state.calculations.filter(c=>c.tenantId===modal.id&&c.startSource==='initial'):[];if(old&&!tenantFields.some(([k])=>String(old[k]??'')!==String(d[k]??''))){if(!stayOpen)closeModal();return}let apply=(propagate)=>{if(old){let changes=tenantFields.some(([k])=>String(old[k]??'')!==String(d[k]??''));Object.assign(old,d);if(changes)state.calculations.filter(c=>c.tenantId===old.id).forEach(markStale)}else{d.id=mkId('t');state.tenants.push(d)}if(propagate&&dependent.length){let seen=new Set();dependent.forEach(c=>propagateFrom(c.id,d.initialReading,seen))}save();render();if(stayOpen&&old)openTenant(old.id);else closeModal();toast(old?'Карточка обновлена автоматически.':'Арендатор добавлен.')};if(dependent.length){confirmBox('Обновить зависимые начальные показания?',`Изменение первичных показаний затрагивает ${dependent.length} расчётов, использующих их автоматически. Обновить связанные записи и пересчитать суммы? При отказе новые реквизиты сохранятся, но показания последующих расчётов останутся прежними.`,()=>apply(true),false,()=>apply(false),'Обновить связанные')}else apply(false)}
function dependencyChain(id){let found=[],seen=new Set();function visit(parent){for(let c of state.calculations.filter(c=>c.startSource===parent&&!seen.has(c.id))){seen.add(c.id);found.push(c);visit(c.id)}}visit(id);return found}

let old=modal.id?calcBy(modal.id):null;if(old){let readingsChanged=old.startReading!==d.startReading||old.endReading!==d.endReading;if(old.startReading!==d.startReading){d.startSource='manual';d.manualStart=true}if(readingsChanged){d.manualExpense=null;d.manualAmount=null} else if(old.manualExpense!==d.manualExpense)d.manualAmount=null;

function startExport(){if(!modal.act&&!modal.invoice){modalError('export-error','Выберите хотя бы один вид документа.');return}let types=['act','invoice'].filter(t=>modal[t]);if(!modal.id)return exportBulk(types);let c=calcBy(modal.id);if(!c||!validate(c).ok){modalError('export-error',validate(c).why);return}let meta={};for(let t of types){let date=$('#docdate-'+t)?.value||'',num=String($('#docnum-'+t)?.value||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d+$/.test(num)||BigInt(num)<1n){modalError('export-error',`Для ${t==='act'?'акта':'счёта'} укажите действительную дату и положительный целый номер.`);return}meta[t]={date,number:String(BigInt(num))}}let duplicate=types.filter(t=>state.calculations.some(x=>x.id!==c.id&&x.documents?.[t]?.date?.startsWith(meta[t].date.slice(0,4))&&String(x.documents[t].number)===meta[t].number));const proceed=()=>{if(calcExpense(c)===0n)confirmBox('Сформировать документ на 0 ₽?',`Расход равен нулю. Для индивидуальной выгрузки это допустимо только после вашего подтверждения.`,()=>exportOne(c,types,meta),false,null,'Сформировать на 0 ₽');else exportOne(c,types,meta)};if(duplicate.length)return confirmBox('Повтор номера документа',`Номер ${duplicate.map(t=>(t==='act'?'акта':'счёта')+' № '+meta[t].number).join(', ')} уже используется в том же году. По спецификации дубль разрешён после предупреждения.`,proceed,false,null,'Разрешить дублирование');proceed()}

async function exportOne(c,types,meta){closeModal();beginBusy('Формируем демонстрационные PDF…');let success=[],errors=[];for(let t of types){try{let blob=await makePdf(c,t,meta[t]);triggerFile(blob,fileName(c,t,meta[t].number));if(!c.documents)c.documents={};c.documents[t]={number:meta[t].number,date:meta[t].date,generatedAt:nowStamp(),stale:false};success.push(t)}catch(e){errors.push(`${t==='act'?'Акт':'Счёт'}: ${e.message}`)}}save();render();endBusy();if(success.length)toast(`Подготовлено ${success.length} PDF: ${success.map(x=>x==='act'?'акт':'счёт').join(' и ')}. Демо-статус обновлён.`);if(errors.length)toast('Не удалось сформировать: '+errors.join('; '),'error')}
async function exportBulk(types){let active=state.tenants.filter(t=>!t.archived),plan=[];let report={successes:[],skipped:[],errors:[]};for(let t of active){let c=latestReady(t.id);if(!c){report.skipped.push({tenant:t.name,reason:'Нет готового расчёта за выбранный месяц.'});continue}if(calcExpense(c)===0n){report.skipped.push({tenant:t.name,reason:'Последний готовый расчёт имеет нулевой расход.'});continue}plan.push({tenant:t,calc:c})}if(!plan.length){modalError('export-error','Нет пригодных расчётов для выгрузки. Проверьте список пропусков выше.');return}closeModal();beginBusy('Готовим ZIP и демонстрационные PDF…');const entries=[];const completed=[],reserved={};for(let item of plan){let folder=safeFileName(item.tenant.name)+'_'+safeFileName(item.tenant.id)+'/';for(let type of types){let doc=item.calc.documents?.[type],date=doc?.date||today(),series=type+':'+date.slice(0,4),base=docNumber(type,date),num=doc?.number||String(Math.max(Number(base),reserved[series]||0));let meta={date,number:String(num)};try{let blob=await makePdf(item.calc,type,meta);if(!doc?.number)reserved[series]=Number(num)+1;entries.push({name:folder+fileName(item.calc,type,meta.number),bytes:new Uint8Array(await blob.arrayBuffer())});completed.push({calc:item.calc,type,meta});report.successes.push({tenant:item.tenant.name,type,file:fileName(item.calc,type,meta.number)})}catch(e){report.errors.push({tenant:item.tenant.name,reason:`${type==='act'?'Акт':'Счёт'}: ${e.message}`})}}}if(!entries.length){endBusy();showModal({type:'result',report});toast('Не создано ни одного документа.','error');return}try{entries.push({name:'РЕЗУЛЬТАТ_ДЕМО.txt',bytes:new TextEncoder().encode(`Демонстрационный экспорт КОНТАКТ\nСоздано документов: ${report.successes.length}\nПропущено: ${report.skipped.length}\nОшибок: ${report.errors.length}\n\n`+report.skipped.map(x=>`${x.tenant}: ${x.reason}`).join('\n')+'\n'+report.errors.map(x=>`${x.tenant}: ${x.reason}`).join('\n'))});let blob=makeZip(entries);triggerFile(blob,`Кон function unitsWords(n,feminine=false){let one=feminine?'одна':'один',two=feminine?'две':'два';const singles=['',''+one,''+two,'три','четыре','пять','шесть','семь','восемь','девять'];const teens=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];const tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];const hundreds=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];let p=[];if(n>=100)p.push(hundreds[Math.floor(n/100)]);n%=100;if(n>=10&&n<=19){p.push(teens[n-10]);return p.join(' ')}if(n>=20)p.push(tens[Math.floor(n/10)]);n%=10;if(n)p.push(singles[n]);return p.join(' ')}

function jpegToPdf(jpeg,w,h){let sections=[],offsets=[0],position=0;function append(b){sections.push(b);position+=b.length}function obj(n,pieces){offsets[n]=position;append(ascii(`${n} 0 obj\n`));for(let p of pieces)append(typeof p==='string'?ascii(p):p);append(ascii('\nendobj\n'))}append(ascii('%PDF-1.4\n%CONTACT\n'));obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);obj(3,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im1 4 0 R >> >> /Contents 5 0 R >>']);obj(4,[`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`,jpeg,'\nendstream']);let s='q\n595 0 0 842 0 0 cm\n/Im1 Do\nQ\n';obj(5,[`<< /Length ${ascii(s).length} >>\nstream\n${s}endstream`]);let start=position;append(ascii('xref\n0 6\n0000000000 65535 f \n'));for(let i=1;i<=5;i++)append(ascii(`${u32(offsets[i])} 00000 n \n`));append(ascii(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`));return new Blob([joinBytes(sections)],{type:'application/pdf'})}
async function makePdf(c,type,meta){if(!validate(c).ok)throw Error(validate(c).why);let cvs=await drawDocument(c,type,meta),data=cvs.toDataURL('image/jpeg',.88).split(',')[1],bin=atob(data),jpg=Uint8Array.from(bin,x=>x.charCodeAt(0));return jpegToPdf(jpg,cvs.width,cvs.height)}
const crcTable=(()=>{let t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[i]=c>>>0}return t})();
