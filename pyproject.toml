[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-reports"
version = "0.1.0"
description = "Локальное приложение для учета электроэнергии и подготовки документов"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[tool.setuptools.packages.find]
include = ["app*"]
